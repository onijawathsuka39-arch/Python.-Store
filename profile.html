<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Python</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <nav id="navbar" class="scrolled">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Python Logo">
            <span>PYTHON</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="customize.html">Customize</a></li>
            <li><a href="offers.html">Offers</a></li>
        </ul>
        <div class="nav-icons">
            <a href="https://www.instagram.com/" target="_blank"><i data-lucide="instagram"></i></a>
            <a href="https://www.facebook.com/" target="_blank"><i data-lucide="facebook"></i></a>
            <a href="profile.html" class="active"><i data-lucide="user"></i></a>
            <a href="wishlist.html" style="position: relative; margin-right: 5px;">
                <i data-lucide="heart"></i>
                <span id="wishlist-count"
                    style="position: absolute; top: -10px; right: -10px; background: #DC143C; color: white; font-size: 10px; padding: 2px 5px; border-radius: 50%; font-weight: 800;">0</span>
            </a>
            <a href="cart.html" style="position: relative;">
                <i data-lucide="shopping-cart"></i>
                <span id="cart-count"
                    style="position: absolute; top: -10px; right: -10px; background: #c8a96e; color: #0A0F1E; font-size: 10px; padding: 2px 5px; border-radius: 50%; font-weight: 800;">0</span>
            </a>
            <a href="#" id="mobile-menu-btn"><i data-lucide="menu"></i></a>
        </div>
    </nav>

    <div class="menu-overlay" id="menu-overlay"></div>
    <div class="mobile-menu" id="mobile-menu">
        <div class="close-menu" id="close-menu"><i data-lucide="x"></i></div>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="customize.html">Customize</a>
        <a href="offers.html">Offers</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="profile.html">My Account</a>
        <a href="cart.html">Cart</a>
    </div>

    <main class="section" style="padding-top: 140px; min-height: 80vh; background: var(--primary-light);">
        <div id="profile-content" style="max-width: 860px; margin: 0 auto; padding: 0 16px;">
            
            <!-- Profile Card -->
            <div style="background: var(--surface); border: 1px solid var(--border-color); border-radius: 28px; padding: 45px 40px 40px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.06); margin-bottom: 24px; position: relative; overflow: hidden;">
                <!-- Decorative background gradient -->
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 90px; background: linear-gradient(135deg, rgba(220,20,60,0.07) 0%, rgba(255,30,56,0.04) 100%); border-radius: 28px 28px 0 0;"></div>

                <!-- Avatar -->
                <div style="position: relative; z-index: 2;">
                    <div style="width: 90px; height: 90px; background: linear-gradient(135deg, #ff1e38, #DC143C); border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 2.4rem; font-weight: 900; box-shadow: 0 8px 24px rgba(220,20,60,0.35);" id="profile-initial">U</div>
                    <h2 id="profile-name" style="font-size: 1.6rem; font-weight: 900; color: var(--text-main); margin-bottom: 4px;">User Name</h2>
                    <p id="profile-email" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 14px;">email@example.com</p>

                    <div style="display: inline-flex; align-items: center; gap: 7px; background: rgba(220,20,60,0.07); border: 1.5px solid rgba(220,20,60,0.22); color: #DC143C; font-weight: 800; font-size: 0.78rem; padding: 5px 15px; border-radius: 50px;">
                        <i data-lucide="award" style="width: 13px; height: 13px;"></i> Python Club Member
                    </div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px;">
                
                <div class="profile-stat-card" onclick="window.location.href='order-history.html'">
                    <div class="profile-stat-icon" style="background: rgba(220,20,60,0.1);">
                        <i data-lucide="package" style="color: #DC143C; width: 22px; height: 22px;"></i>
                    </div>
                    <div class="profile-stat-num" id="order-count">0</div>
                    <div class="profile-stat-label">Total Orders</div>
                </div>

                <div class="profile-stat-card" onclick="window.location.href='wishlist.html'">
                    <div class="profile-stat-icon" style="background: rgba(255, 59, 48, 0.1);">
                        <i data-lucide="heart" style="color: #ff3b30; width: 22px; height: 22px;"></i>
                    </div>
                    <div class="profile-stat-num" id="profile-wishlist-count">0</div>
                    <div class="profile-stat-label">Saved Wishlist</div>
                </div>

                <div class="profile-stat-card" onclick="window.location.href='cart.html'">
                    <div class="profile-stat-icon" style="background: rgba(0, 122, 255, 0.1);">
                        <i data-lucide="shopping-cart" style="color: #007aff; width: 22px; height: 22px;"></i>
                    </div>
                    <div class="profile-stat-num" id="profile-cart-count">0</div>
                    <div class="profile-stat-label">Cart Items</div>
                </div>

                <div class="profile-stat-card" style="border-color: rgba(255,149,0,0.3); background: rgba(255,149,0,0.04);">
                    <div class="profile-stat-icon" style="background: rgba(255,149,0,0.12);">
                        <i data-lucide="award" style="color: #ff9500; width: 22px; height: 22px;"></i>
                    </div>
                    <div class="profile-stat-num" id="profile-points-count" style="color: #ff9500;">0</div>
                    <div class="profile-stat-label" id="profile-points-value">Python Club Points</div>
                </div>

            </div>

            <!-- Quick Actions -->
            <div style="display: flex; gap: 14px; flex-wrap: wrap;">
                <a href="order-history.html" class="btn btn-primary" style="text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 9px; flex: 1; min-width: 180px; padding: 15px 24px; border-radius: 16px; font-weight: 800; font-size: 0.95rem;">
                    <i data-lucide="history" style="width: 18px;"></i> Order History
                </a>
                <button class="btn btn-outline" style="flex: 1; min-width: 180px; padding: 15px 24px; border-radius: 16px; font-weight: 800; font-size: 0.95rem;" onclick="logout()">
                    <i data-lucide="log-out" style="width: 18px; margin-right: 8px;"></i> Sign Out
                </button>
            </div>

        </div>
    </main>


    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Python. Powered by Roohira Collection</p>
        </div>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script>
        lucide.createIcons();

        // Use Firebase Auth state to protect this page
        if (typeof auth !== 'undefined' && auth) {
            auth.onAuthStateChanged(function(firebaseUser) {
                if (!firebaseUser) {
                    // Not logged in — redirect to login
                    window.location.href = 'login.html';
                    return;
                }
                // Fetch profile from Firestore
                db.collection('users').doc(firebaseUser.uid).get().then(function(doc) {
                    const name = doc.exists ? doc.data().name : firebaseUser.email.split('@')[0];
                    document.getElementById('profile-name').innerText = name;
                    document.getElementById('profile-email').innerText = firebaseUser.email;
                    document.getElementById('profile-initial').innerText = name.charAt(0).toUpperCase();
                    // Set dynamic wishlist length
                    const wl = JSON.parse(localStorage.getItem('python_wishlist')) || [];
                    document.getElementById('profile-wishlist-count').innerText = wl.length;
                    // Set dynamic cart length
                    const cartItems = JSON.parse(localStorage.getItem('python_cart')) || [];
                    document.getElementById('profile-cart-count').innerText = cartItems.reduce((acc, curr) => acc + (curr.quantity || 1), 0);
                    
                    // Show points
                    const points = doc.exists && doc.data().clubPoints !== undefined ? doc.data().clubPoints : 0;
                    const pointsVal = (points / 20 * 10).toFixed(0);
                    document.getElementById('profile-points-count').innerText = points;
                    document.getElementById('profile-points-value').innerText = `${points} pts = Rs. ${pointsVal}`;

                    // Load orders
                    if (typeof loadProfile === 'function') loadProfile();
                });
            });
        } else {
            // Fallback to localStorage if Firebase not configured yet
            document.addEventListener('DOMContentLoaded', function() {
                const user = JSON.parse(localStorage.getItem('python_user'));
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }
                document.getElementById('profile-name').innerText = user.name;
                document.getElementById('profile-email').innerText = user.email;
                document.getElementById('profile-initial').innerText = user.name.charAt(0).toUpperCase();
                const wl = JSON.parse(localStorage.getItem('python_wishlist')) || [];
                document.getElementById('profile-wishlist-count').innerText = wl.length;
                const cartItems = JSON.parse(localStorage.getItem('python_cart')) || [];
                document.getElementById('profile-cart-count').innerText = cartItems.reduce((acc, curr) => acc + (curr.quantity || 1), 0);
                const points = user.clubPoints || 0;
                const pointsVal = (points / 20 * 10).toFixed(0);
                document.getElementById('profile-points-count').innerText = points;
                document.getElementById('profile-points-value').innerText = `${points} pts = Rs. ${pointsVal}`;
            });
        }
    </script>
</body>

</html>
