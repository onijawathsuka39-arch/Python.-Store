<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Python</title>
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <nav id="navbar">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Python Logo">
            <span>PYTHON</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html" class="active">Shop</a></li>
            <li><a href="customize.html">Customize</a></li>
            <li><a href="offers.html">Offers</a></li>
            <li><a href="reviews.html">Reviews</a></li>
        </ul>
        <div class="nav-icons">
            <a href="https://www.instagram.com/" target="_blank"><i data-lucide="instagram"></i></a>
            <a href="https://www.facebook.com/" target="_blank"><i data-lucide="facebook"></i></a>
            <a href="profile.html"><i data-lucide="user"></i></a>
            <a href="wishlist.html" style="position: relative; margin-right: 5px;">
                <i data-lucide="heart"></i>
                <span id="wishlist-count"
                    style="position: absolute; top: -10px; right: -10px; background: #DC143C; color: white; font-size: 10px; padding: 2px 5px; border-radius: 50%; font-weight: 800;">0</span>
            </a>
            <a href="cart.html" style="position: relative;">
                <i data-lucide="shopping-cart"></i>
                <span id="cart-count"
                    style="position: absolute; top: -10px; right: -10px; background: var(--accent-gold); color: white; font-size: 10px; padding: 2px 5px; border-radius: 50%; font-weight: 800;">0</span>
            </a>
            <a href="#" id="mobile-menu-btn"><i data-lucide="menu"></i></a>
        </div>
    </nav>

    <div class="menu-overlay" id="menu-overlay"></div>
    <div class="mobile-menu" id="mobile-menu">
        <div class="close-menu" id="close-menu"><i data-lucide="x"></i></div>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="customize.html">Customize</a>
        <a href="offers.html">Offers</a>
        <a href="reviews.html">Reviews</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="profile.html">My Account</a>
        <a href="cart.html">Cart</a>
    </div>

    <!-- Ambient Floating Background Shapes -->
    <div class="ambient-glow-wrapper">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>

    <main class="section" style="padding-top: 140px; min-height: 80vh; position: relative; z-index: 1;">
        <div class="section-title" style="margin-bottom: 35px;">
            <span class="modern-pill animate-fade-up stagger-1" style="margin-bottom: 15px;"><i data-lucide="tag"></i> Official Python Store</span>
            <h2 class="animate-fade-up stagger-2" style="font-size: 2.8rem;">Explore Our <span style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Collection</span></h2>
            <p class="animate-fade-up stagger-3" style="font-size: 1.05rem;">Heavyweight fabrics, iconic graphics, and tailored luxury cuts</p>
        </div>

        <!-- Modern Shop Search & Filter Toolbar -->
        <div class="shop-toolbar animate-fade-up stagger-3">
            <div class="shop-top-bar">
                <div class="shop-search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="shop-search" placeholder="Search by name, fit, style or GSM..." oninput="handleSearch(this.value)">
                </div>

                <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                    <button onclick="openSizeChart()" class="btn btn-outline" style="padding: 10px 20px; font-size: 0.85rem; border-radius: 50px; display: inline-flex; align-items: center; gap: 8px;">
                        <i data-lucide="ruler" style="width: 16px;"></i> Size Chart
                    </button>
                    <div style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); background: var(--primary-light); padding: 8px 16px; border-radius: 50px; border: 1px solid var(--border-color);">
                        <i data-lucide="box" style="width: 14px; vertical-align: middle;"></i> 100% In Stock
                    </div>
                </div>
            </div>

            <!-- Filter Glass Rows: Categories Only -->
            <div class="filter-glass-row" id="category-row-wrapper">
                <span class="filter-label-badge"><i data-lucide="layers" style="width: 14px;"></i> Category</span>
                <div class="filter-pills-list">
                    <button class="filter-pill category-btn active" onclick="selectCategory('All', this)">All Items</button>
                    <button class="filter-pill category-btn" onclick="selectCategory('Regular Tee (Printed)', this)">Regular Fit</button>
                    <button class="filter-pill category-btn" onclick="selectCategory('Oversized Tee (Printed)', this)">Oversized Streetwear</button>
                </div>
            </div>
        </div>

        <div class="product-grid" id="product-grid" style="max-width: 1200px; margin: 0 auto;">
            <!-- Products will be dynamically loaded here by script.js -->
        </div>
    </main>



    <!-- Size Chart Modal -->
    <div id="sizeChartModal" class="modal-overlay" onclick="closeSizeChart()"
        style="display:none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); align-items: center; justify-content: center;">
        <div class="glass"
            style="max-width: 90%; max-height: 90%; position: relative; padding: 10px; background: white; border-radius: 20px;"
            onclick="event.stopPropagation()">
            <span onclick="closeSizeChart()"
                style="position: absolute; right: -15px; top: -15px; background: #DC143C; color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(220, 20, 60, 0.3);">&times;</span>
            <img src="https://i.ibb.co/pvGrdQMD/Size-Chart-01.jpg" alt="Size Chart"
                style="width: 100%; height: auto; max-height: 80vh; border-radius: 15px; display: block;">
        </div>
    </div>

    <style>
        /* GSM sub-category buttons — outline only, no fill */
        .gsm-sub {
            padding: 5px 14px !important;
            border-radius: 50px !important;
            border: 1.5px solid #333 !important;
            background: transparent !important;
            color: var(--primary-dark) !important;
            font-size: 0.75rem !important;
            font-weight: 700 !important;
            box-shadow: none !important;
            transform: none !important;
        }
        .gsm-sub:hover {
            border-color: #DC143C !important;
            color: #DC143C !important;
            background: transparent !important;
            box-shadow: none !important;
            transform: none !important;
        }
        .gsm-sub.active {
            border-color: #DC143C !important;
            color: #DC143C !important;
            background: transparent !important;
            box-shadow: none !important;
            transform: none !important;
        }

        .product-card:hover .size-chart-card-btn {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .size-chart-card-btn:hover {
            background: #000 !important;
            color: #fff !important;
        }

        .modal-overlay.active {
            display: flex !important;
        }

        #shop-search:focus {
            border-color: var(--accent-gold) !important;
            box-shadow: 0 10px 25px rgba(220, 20, 60, 0.15) !important;
        }
    </style>

    <footer class="footer">
        <!-- Footer content -->
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script>
        lucide.createIcons();

        function openSizeChart() {
            document.getElementById('sizeChartModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeSizeChart() {
            document.getElementById('sizeChartModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const cat = urlParams.get('cat') || urlParams.get('category');
            if (cat === 'regular') {
                selectCategory('Regular Tee (Printed)');
            } else if (cat === 'oversized') {
                selectCategory('Oversized Tee (Printed)');
            } else if (cat) {
                selectCategory(cat);
            } else {
                if (typeof filterShop === 'function') {
                    filterShop();
                } else if (typeof displayProducts === 'function' && typeof products !== 'undefined') {
                    displayProducts(products);
                }
            }
        });
    </script>
</body>

</html>
