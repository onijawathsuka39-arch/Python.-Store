<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Python</title>
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <nav id="navbar">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Python Logo">
            <span>PYTHON</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html" class="active">Shop</a></li>
            <li><a href="customize.html">Customize</a></li>
            <li><a href="offers.html">Offers</a></li>
            <li><a href="reviews.html">Reviews</a></li>
        </ul>
        <div class="nav-icons">
            <a href="https://www.instagram.com/" target="_blank"><i data-lucide="instagram"></i></a>
            <a href="https://www.facebook.com/" target="_blank"><i data-lucide="facebook"></i></a>
            <a href="profile.html"><i data-lucide="user"></i></a>
            <a href="wishlist.html" style="position: relative; margin-right: 5px;">
                <i data-lucide="heart"></i>
                <span id="wishlist-count"
                    style="position: absolute; top: -10px; right: -10px; background: #DC143C; color: white; font-size: 10px; padding: 2px 5px; border-radius: 50%; font-weight: 800;">0</span>
            </a>
            <a href="cart.html" style="position: relative;">
                <i data-lucide="shopping-cart"></i>
                <span id="cart-count"
                    style="position: absolute; top: -10px; right: -10px; background: var(--accent-gold); color: white; font-size: 10px; padding: 2px 5px; border-radius: 50%; font-weight: 800;">0</span>
            </a>
            <a href="#" id="mobile-menu-btn"><i data-lucide="menu"></i></a>
        </div>
    </nav>

    <div class="menu-overlay" id="menu-overlay"></div>
    <div class="mobile-menu" id="mobile-menu">
        <div class="close-menu" id="close-menu"><i data-lucide="x"></i></div>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="customize.html">Customize</a>
        <a href="offers.html">Offers</a>
        <a href="reviews.html">Reviews</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="profile.html">My Account</a>
        <a href="cart.html">Cart</a>
    </div>

    <!-- Ambient Floating Background Shapes -->
    <div class="ambient-glow-wrapper">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>

    <main class="section" style="padding-top: 140px; min-height: 80vh; position: relative; z-index: 1;">
        <div class="section-title" style="text-align: center; margin-bottom: 35px;">
            <span class="modern-pill" style="display: inline-flex; align-items: center; gap: 8px; margin-bottom: 15px; padding: 6px 18px; border-radius: 50px; background: rgba(255, 30, 56, 0.08); border: 1px solid rgba(255, 30, 56, 0.25); color: #ff1e38; font-size: 0.85rem; font-weight: 700;">
                <i data-lucide="tag" style="width: 14px;"></i> Official Python Store
            </span>
            <h2 style="font-size: 2.8rem; font-weight: 900; margin-bottom: 10px; color: var(--text-main);">
                Explore Our <span style="color: #DC143C;">Collection</span>
            </h2>
            <p style="font-size: 1.05rem; color: var(--text-muted);">Heavyweight fabrics, iconic graphics, and tailored luxury cuts</p>
        </div>

        <!-- Modern Shop Search & Filter Toolbar -->
        <div class="shop-toolbar" style="max-width: 1200px; margin: 0 auto 30px; display: flex; flex-direction: column; gap: 12px;">

            <!-- Search Bar Row -->
            <div class="shop-top-bar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; background: var(--surface); padding: 14px 20px; border-radius: 18px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                <div class="shop-search-box" style="position: relative; flex: 1; min-width: 220px;">
                    <i data-lucide="search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 16px; height: 16px;"></i>
                    <input type="text" id="shop-search" placeholder="Search products, styles, designs..." oninput="handleSearch(this.value)" style="width: 100%; padding: 11px 18px 11px 42px; border-radius: 50px; border: 1.5px solid var(--border-color); background: var(--primary-light); color: var(--text-main); font-size: 0.9rem; outline: none; transition: border-color 0.3s, box-shadow 0.3s; font-family: 'Anta', sans-serif;">
                </div>
                <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
                    <div style="font-size: 0.78rem; font-weight: 700; color: #22c55e; background: rgba(34,197,94,0.08); padding: 8px 14px; border-radius: 50px; border: 1px solid rgba(34,197,94,0.25); display: flex; align-items: center; gap: 5px; white-space: nowrap;">
                        <i data-lucide="check-circle" style="width: 13px;"></i> 100% In Stock
                    </div>
                </div>
            </div>

            <!-- Category Filter Row -->
            <div class="filter-glass-row" id="category-row-wrapper" style="display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--surface); border-radius: 14px; border: 1px solid var(--border-color); box-shadow: 0 3px 10px rgba(0,0,0,0.04); flex-wrap: wrap;">
                <span style="font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent-gold); white-space: nowrap; flex-shrink: 0;">Category</span>
                <div class="filter-pills-list" style="display: flex; gap: 7px; flex-wrap: wrap;">
                    <button class="filter-pill category-btn active" onclick="selectCategory('All', this)">All</button>
                    <button class="filter-pill category-btn" onclick="selectCategory('Regular Tee (Printed)', this)">Regular Fit</button>
                    <button class="filter-pill category-btn" onclick="selectCategory('Oversized Tee (Printed)', this)">Oversized</button>
                    <button class="filter-pill category-btn" onclick="selectCategory('Waffle Tee', this)">Waffle</button>
                </div>
            </div>

        </div>

        <div class="product-grid" id="product-grid" style="max-width: 1200px; margin: 0 auto;">
            <!-- Products will be loaded from script.js -->
        </div>
    </main>



    <!-- Size Chart Modal -->
    <div id="sizeChartModal" class="modal-overlay" onclick="closeSizeChart()"
        style="display:none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); align-items: center; justify-content: center;">
        <div class="glass"
            style="max-width: 90%; max-height: 90%; position: relative; padding: 10px; background: white; border-radius: 20px;"
            onclick="event.stopPropagation()">
            <span onclick="closeSizeChart()"
                style="position: absolute; right: -15px; top: -15px; background: #DC143C; color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(220, 20, 60, 0.3);">&times;</span>
            <img src="https://i.ibb.co/pvGrdQMD/Size-Chart-01.jpg" alt="Size Chart"
                style="width: 100%; height: auto; max-height: 80vh; border-radius: 15px; display: block;">
        </div>
    </div>

    <style>
        /* GSM sub-category buttons — outline only, no fill */
        .gsm-sub {
            padding: 5px 14px !important;
            border-radius: 50px !important;
            border: 1.5px solid #333 !important;
            background: transparent !important;
            color: var(--primary-dark) !important;
            font-size: 0.75rem !important;
            font-weight: 700 !important;
            box-shadow: none !important;
            transform: none !important;
        }
        .gsm-sub:hover {
            border-color: #DC143C !important;
            color: #DC143C !important;
            background: transparent !important;
            box-shadow: none !important;
            transform: none !important;
        }
        .gsm-sub.active {
            border-color: #DC143C !important;
            color: #DC143C !important;
            background: transparent !important;
            box-shadow: none !important;
            transform: none !important;
        }

        .product-card:hover .size-chart-card-btn {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .size-chart-card-btn:hover {
            background: #000 !important;
            color: #fff !important;
        }

        .modal-overlay.active {
            display: flex !important;
        }

        #shop-search:focus {
            border-color: var(--accent-gold) !important;
            box-shadow: 0 10px 25px rgba(220, 20, 60, 0.15) !important;
        }
    </style>

    <footer class="footer">
        <!-- Footer content -->
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script>
        lucide.createIcons();

        function openSizeChart() {
            document.getElementById('sizeChartModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeSizeChart() {
            document.getElementById('sizeChartModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>

</html>
